<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Slide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="popup" class="popup">
            <div class="popup-content">
                <h2>🎉 Você venceu!</h2>
                <button onclick="fecharPopup()" id="btn-vitoria">Escolha uma dificuldade para jogar novamente</button>
            </div>
        </div>
        <div id="tabuleiro"></div>
        <div id="botoes">
            <button id="facil">Fácil</button>
            <button id="medio">Médio</button>
            <button id="dificil">Difícil</button>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
